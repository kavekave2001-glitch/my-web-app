@'
name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push App1
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/my-docker-app/app1:$TAG" \
            ./app1

          docker push \
            "$REGISTRY/my-docker-app/app1:$TAG"

      - name: Build and push App2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/my-docker-app/app2:$TAG" \
            ./app2

          docker push \
            "$REGISTRY/my-docker-app/app2:$TAG"
'@ | Set-Content -Encoding utf8 .github\workflows\docker-ecr.yml